<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="app-shell">
        <div class="login-wrapper">
            <h2>Reset Password</h2>
            <div class="card login-card">
                <div id="token-section" style="display:none">
                    <div class="form-group">
                        <label class="form-label">New password</label>
                        <input type="password" id="newPasswordToken" class="form-input" placeholder="New password">
                    </div>
                    <button class="btn btn-primary form-action-btn" onclick="resetWithToken()">Set password</button>
                </div>

                <div id="otp-section" style="display:none">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="emailOtp" class="form-input" placeholder="name@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label">OTP</label>
                        <input type="text" id="otp" class="form-input" placeholder="Enter OTP">
                    </div>
                    <div class="form-group">
                        <label class="form-label">New password</label>
                        <input type="password" id="newPasswordOtp" class="form-input" placeholder="New password">
                    </div>
                    <button class="btn btn-primary form-action-btn" onclick="resetWithOtp()">Set password</button>
                </div>

                <div id="message" class="info-message" style="margin-top:8px"></div>
                <div style="margin-top:12px; text-align:center">
                    <a href="index.html?ts=0" id="backToLoginLink">Back to login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/session.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
