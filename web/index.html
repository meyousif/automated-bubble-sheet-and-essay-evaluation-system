<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="app-shell">
        <div class="login-wrapper">
            <div class="brand-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>

            <h1 class="login-title">
                Automated Bubble Sheet<br>
                &amp;<br>
                Essay Evaluation System
            </h1>

            <div class="card login-card">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-icon-wrap">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input
                            type="text"
                            id="username"
                            class="form-input input-with-icon"
                            placeholder="Enter your username"
                            autocomplete="username"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>

                    <div class="input-icon-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input
                            type="password"
                            id="password"
                            class="form-input input-with-icon"
                            placeholder="••••••••"
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <button class="btn btn-primary login-btn" onclick="attemptLogin()">Login</button>
                <div style="margin-top:8px; text-align:right;">
                    <a href="forgot-password.html">Forgot password?</a>
                </div>
                <div id="errorMessage" class="error-message"></div>
            </div>

            <div class="login-footer">
                © 2026 Sukkur IBA University | FYP Code: 22F-20
            </div>
        </div>
    </div>

    <script>
        if (window.location.protocol.startsWith("http")) {
            const eelScript = document.createElement("script");
            eelScript.type = "text/javascript";
            eelScript.src = "/eel.js";
            document.head.appendChild(eelScript);
        }
    </script>
    <script src="js/session.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
