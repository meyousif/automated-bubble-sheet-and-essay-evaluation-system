<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="app-shell">
        <div class="login-wrapper">
            <h2>Forgot Password</h2>
            <div class="card login-card">
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-input" placeholder="name@example.com">
                </div>

                <button class="btn btn-primary form-action-btn" onclick="requestOtp()">Send OTP</button>
                <div id="message" class="info-message" style="margin-top:8px"></div>
                <div id="continueWrap" style="margin-top:8px; display:none; text-align:center;">
                    <a id="continueLink" href="reset-password.html">Continue to reset form</a>
                </div>
                <div style="margin-top:12px; text-align:center">
                    <a href="index.html?ts=0" id="backToLoginLink">Back to login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/session.js"></script>
    <script src="js/forgot-password.js"></script>
</body>
</html>
